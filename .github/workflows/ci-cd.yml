name: CI/CD

# Un solo workflow para verificar y desplegar. Lo que separa las dos cosas es la
# condicion de los jobs de despliegue.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read
  id-token: write

env:
  NODE_VERSION: '22'
  AWS_REGION: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}
  AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN || secrets.AWS_DEPLOY_ROLE_ARN }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || secrets.ECR_REPOSITORY }}
  LAMBDA_FUNCTION_NAME: ${{ vars.LAMBDA_FUNCTION_NAME || secrets.LAMBDA_FUNCTION_NAME }}
  NODE_API_URL: ${{ vars.NODE_API_URL || vars.API_BASE_URL || vars.PUBLIC_API_URL || secrets.NODE_API_URL || secrets.API_BASE_URL || secrets.PUBLIC_API_URL || '' }}
  SMOKE_USERNAME: ${{ vars.SMOKE_USERNAME || secrets.SMOKE_USERNAME }}

jobs:
  verify:
    name: verificar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      # npm ci falla si el lockfile no cuadra con package.json, que es
      # exactamente lo que queremos detectar aqui y no al construir la imagen.
      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Comprobar tipos
        run: npm run typecheck

      - name: Tests con cobertura
        # El umbral del 80% esta en jest.config.js, asi que este paso falla solo.
        run: npm run test:coverage

  image:
    name: imagen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Construir
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: desplegar
    needs: [verify, image]
    # ESTA CONDICION ES LO QUE EVITA DESPLEGAR EN CADA PULL REQUEST.
    # Si se toca, comprobar que un pull request sigue sin llegar a AWS.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    # La configuracion de la funcion vive en este job y no en el env: del workflow, para no
    # inyectarla tambien en el job de verificacion, donde puede alterar lo que miden los tests.
    #
    # update-function-configuration REEMPLAZA el mapa de variables completo, asi que lo que falte
    # aqui desaparece de la Lambda al desplegar. Sin JWT_SECRET, node-api no arranca.
    env:
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      NODE_API_PORT: ${{ vars.NODE_API_PORT || '3000' }}
      LOG_LEVEL: ${{ vars.LOG_LEVEL || 'info' }}
    steps:
      - uses: actions/checkout@v4

      - name: Validar variables de despliegue
        run: |
          set -euo pipefail
          if [ -z "$ECR_REPOSITORY" ]; then
            echo "Falta la variable ECR_REPOSITORY en GitHub Actions (Variables o Secrets)."
            exit 1
          fi
          if [ -z "$LAMBDA_FUNCTION_NAME" ]; then
            echo "Falta la variable LAMBDA_FUNCTION_NAME en GitHub Actions (Variables o Secrets)."
            exit 1
          fi
          if [ -z "${NODE_API_URL:-}" ]; then
            echo "Falta la variable NODE_API_URL en GitHub Actions (Variables o Secrets)."
            echo "Pon aquí la URL pública real de este backend Node, por ejemplo https://tu-dominio.com/api/v1"
            exit 1
          fi
          if [ -z "${CORS_ALLOWED_ORIGINS:-}" ]; then
            echo "Falta la variable CORS_ALLOWED_ORIGINS en GitHub Actions (Variables o Secrets)."
            echo "Pon aquí el origen del frontend, por ejemplo https://tu-frontend.com"
            exit 1
          fi

          # Se valida antes de tocar AWS porque el paso de configuración reemplaza el mapa
          # entero: desplegar sin JWT_SECRET deja node-api sin arrancar, y el gateway responde
          # 502 en cada factorización.
          if [ -z "${JWT_SECRET:-}" ]; then
            echo "Falta el secret JWT_SECRET en GitHub Actions."
            echo "Tiene que ser el mismo valor que en go-api: node-api valida lo que go-api firma."
            exit 1
          fi
          if [ ${#JWT_SECRET} -lt 32 ]; then
            echo "JWT_SECRET tiene ${#JWT_SECRET} caracteres y el mínimo son 32."
            exit 1
          fi

      - name: Autenticar en AWS con OIDC
        if: ${{ env.AWS_DEPLOY_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-deploy-node-api-${{ github.run_id }}

      - name: Autenticar en AWS con credenciales estáticas
        if: ${{ env.AWS_DEPLOY_ROLE_ARN == '' && env.AWS_ACCESS_KEY_ID != '' && env.AWS_SECRET_ACCESS_KEY != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verificar autenticación AWS
        run: |
          set -euo pipefail
          aws sts get-caller-identity >/dev/null

      - name: Login en ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Verificar acceso al repositorio ECR
        run: |
          set -euo pipefail
          echo "Repositorio ECR: $ECR_REPOSITORY"
          aws ecr describe-repositories \
            --repository-names "$ECR_REPOSITORY" \
            --region "$AWS_REGION" \
            --no-cli-pager >/dev/null

      - uses: docker/setup-buildx-action@v3

      - name: Construir y publicar la imagen
        run: |
          set -euo pipefail
          docker build \
            --platform linux/amd64 \
            --tag "${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}" \
            --tag "${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest" \
            .
          docker push "${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}"
          docker push "${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest"

      - name: Actualizar la funcion Lambda
        run: |
          set -euo pipefail

          image="${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}"
          echo "Desplegando $image"

          aws lambda update-function-code \
            --function-name "$LAMBDA_FUNCTION_NAME" \
            --image-uri "$image" \
            --publish \
            --no-cli-pager

          aws lambda wait function-updated \
            --function-name "$LAMBDA_FUNCTION_NAME"

          # El mapa se construye con jq y no interpolando la forma corta Variables={K=V,...}:
          # esa notacion se rompe con cualquier valor que contenga una coma o un igual, y aqui
          # viaja un secreto. La salida se descarta porque incluye las variables de la funcion.
          entorno=$(jq -n \
            --arg cors_allowed_origins "$CORS_ALLOWED_ORIGINS" \
            --arg jwt_secret "$JWT_SECRET" \
            --arg node_api_port "$NODE_API_PORT" \
            --arg log_level "$LOG_LEVEL" \
            '{Variables: {
              CORS_ALLOWED_ORIGINS: $cors_allowed_origins,
              JWT_SECRET: $jwt_secret,
              NODE_API_PORT: $node_api_port,
              LOG_LEVEL: $log_level,
              NODE_ENV: "production"
            }}')

          aws lambda update-function-configuration \
            --function-name "$LAMBDA_FUNCTION_NAME" \
            --environment "$entorno" \
            --no-cli-pager > /dev/null

          aws lambda wait function-updated \
            --function-name "$LAMBDA_FUNCTION_NAME"

          estado=$(aws lambda get-function-configuration \
            --function-name "$LAMBDA_FUNCTION_NAME" \
            --query 'LastUpdateStatus' --output text)

          echo "LastUpdateStatus: $estado"
          [ "$estado" = "Successful" ] || exit 1

  smoke:
    name: smoke test
    needs: deploy
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    steps:
      # Este servicio no es publico, asi que se comprueba a traves de go-api: un
      # 200 aqui significa que el gateway lo alcanzo y le reenvio el token.
      #
      # Requiere que go-api este desplegado. Si aun no lo esta, este paso falla, y
      # es correcto que falle.
      - name: Estadisticas a traves del gateway
        run: |
          set -euo pipefail

          token=$(curl -fsS --retry 5 --retry-delay 5 \
            -X POST "$NODE_API_URL/auth/login" \
            -H 'Content-Type: application/json' \
            -d "{\"username\":\"$SMOKE_USERNAME\",\"password\":\"${{ secrets.SMOKE_PASSWORD }}\"}" \
            | jq -r '.data.accessToken')

          [ -n "$token" ] && [ "$token" != "null" ] || { echo "No se obtuvo token"; exit 1; }

          curl -fsS -X POST "$NODE_API_URL/factorization" \
            -H "Authorization: Bearer $token" \
            -H 'Content-Type: application/json' \
            -d '{"matrix":[[2,0],[0,3]]}' \
            | jq -e '.data.statistics.q.isDiagonal == true
                     and .data.statistics.r.isDiagonal == true' > /dev/null

          echo "Estadisticas verificadas a traves de go-api"
