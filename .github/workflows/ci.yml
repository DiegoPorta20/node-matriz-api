name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  verify:
    name: verificar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      # npm ci falla si el lockfile no cuadra con package.json, que es
      # exactamente lo que queremos detectar aqui y no al construir la imagen.
      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Comprobar tipos
        run: npm run typecheck

      - name: Tests con cobertura
        # El umbral del 80% esta en jest.config.js, asi que este paso falla solo.
        run: npm run test:coverage

  image:
    name: imagen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Construir
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
